base_locale: en
locales: [en]

data:
  read:
    - config/locales/%{locale}/**/*.yml

search:
  paths:
    - app/
  relative_roots:
    - app/views

# Rails resolves these keys through model/form/error conventions rather than
# explicit translation calls. Their behavior is covered by application tests.
ignore_unused:
  - activerecord.attributes.*
  - activerecord.errors.*
  - activerecord.models.*
  - asset_types.form.Edit help
  - asset_types.form.New help
  - asset_types.index.Built-in
  - asset_types.index.Custom
  - errors.messages.cannot_destroy_system
  - errors.messages.cannot_destroy_with_instruments
