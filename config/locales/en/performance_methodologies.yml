        the legend. Period, currency, and history remain encoded in the URL.
      Introduction: Return is not a single universal number. caramelo offers two calculations
        because contribution timing and accumulated profit answer different, equally
        useful questions.
      Modified Dietz: Modified Dietz
      Modified Dietz explanation: This answers “How did the capital perform after
        accounting for when money entered or left?” Each cash flow is weighted by
        how much of the selected period remained.
