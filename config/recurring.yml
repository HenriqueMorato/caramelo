#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  capture_daily_closing_prices:
    class: CaptureDailyClosingPricesJob
    queue: market_prices
    schedule: at 2am every day

  capture_historical_exchange_rates:
    class: CaptureHistoricalExchangeRatesJob
    queue: market_prices
    schedule: at 2:15am every day

  refresh_traded_market_prices:
    class: RefreshTradedMarketPricesJob
    queue: market_prices
    schedule: <%= Caramelo::Environment.fetch("CURRENT_PRICE_REFRESH_SCHEDULE", default: "every 5 minutes") %>

  capture_market_benchmark_observations:
    class: CaptureMarketBenchmarkObservationsJob
    queue: market_prices
    schedule: <%= Caramelo::Environment.fetch("BENCHMARK_REFRESH_SCHEDULE", default: "at 2:30am every day") %>

  create_backup:
    class: CreateBackupJob
    queue: maintenance
    schedule: <%= Caramelo::Environment.fetch("BACKUP_SCHEDULE", default: "at 3am every day") %>

production:
  capture_daily_closing_prices:
    class: CaptureDailyClosingPricesJob
    queue: market_prices
    schedule: at 2am every day

  capture_historical_exchange_rates:
    class: CaptureHistoricalExchangeRatesJob
    queue: market_prices
    schedule: at 2:15am every day

  refresh_traded_market_prices:
    class: RefreshTradedMarketPricesJob
    queue: market_prices
    schedule: <%= Caramelo::Environment.fetch("CURRENT_PRICE_REFRESH_SCHEDULE", default: "every 5 minutes") %>

  capture_market_benchmark_observations:
    class: CaptureMarketBenchmarkObservationsJob
    queue: market_prices
    schedule: <%= Caramelo::Environment.fetch("BENCHMARK_REFRESH_SCHEDULE", default: "at 2:30am every day") %>

  create_backup:
    class: CreateBackupJob
    queue: maintenance
    schedule: <%= Caramelo::Environment.fetch("BACKUP_SCHEDULE", default: "at 3am every day") %>

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
