name: "local_folio"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    environment:
      CAPYBARA_SERVER_PORT: 45678
      SELENIUM_HOST: selenium

    ports:
    - "3000:3000"

    working_dir: /workspaces/local_folio

    volumes:
    - ..:/workspaces/local_folio:cached
    # Keep Linux-native gems separate from the host checkout's bundle.
    - bundle:/workspaces/local_folio/vendor/bundle
    # Keep disposable SQLite backends off the macOS bind mount.
    - runtime-storage:/workspaces/local_folio/storage/runtime

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    depends_on:
      selenium:
        condition: service_started
      runtime-storage-init:
        condition: service_completed_successfully

  runtime-storage-init:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: root
    command: sh -lc "chown -R vscode:vscode /workspaces/local_folio/storage/runtime"
    volumes:
    - runtime-storage:/workspaces/local_folio/storage/runtime

  selenium:
    image: selenium/standalone-chromium
    restart: unless-stopped

volumes:
  bundle:
  runtime-storage:
